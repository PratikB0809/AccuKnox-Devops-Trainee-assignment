version: '3.8'

services:
  wisecow:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4499:4499"
    environment:
      - SRVPORT=4499
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4499/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # NGINX reverse proxy for local HTTPS testing
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - wisecow
    restart: unless-stopped

volumes:
  ssl_certs:
