name: Wisecow CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Build and Test Job
  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.tags }}

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Test Docker image
      run: |
        echo "Testing Docker image..."
        docker run --rm -d --name wisecow-test -p 8080:4499 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        sleep 10
        curl -f http://localhost:8080/ || exit 1
        docker stop wisecow-test
        echo "✅ Docker image test passed!"

  # Security Scanning Job
  security-scan:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ needs.build-and-test.outputs.image-tag }}
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  # Deploy to Development
  deploy-dev:
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: development

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure kubectl
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBECONFIG_DEV }}

    - name: Deploy to Development
      run: |
        # Update image in deployment
        sed -i 's|your-registry/wisecow:latest|${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|g' k8s/01-deployment.yaml

        # Apply manifests
        kubectl apply -f k8s/namespace.yaml
        kubectl apply -f k8s/cluster-issuer.yaml
        kubectl apply -f k8s/deployment.yaml
        kubectl apply -f k8s/service.yaml
        kubectl apply -f k8s/ingress.yaml
        kubectl apply -f k8s/certificate.yaml

        # Wait for deployment to complete
        kubectl rollout status deployment/wisecow-deployment -n wisecow --timeout=300s

        # Verify deployment
        kubectl get pods -n wisecow
        kubectl get services -n wisecow
        kubectl get ingress -n wisecow

  # Deploy to Production
  deploy-prod:
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan, deploy-dev]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure kubectl
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBECONFIG_PROD }}

    - name: Deploy to Production
      run: |
        # Update image in deployment
        sed -i 's|your-registry/wisecow:latest|${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|g' k8s/01-deployment.yaml

        # Apply manifests
        kubectl apply -f k8s/namespace.yaml
        kubectl apply -f k8s/cluster-issuer.yaml
        kubectl apply -f k8s/deployment.yaml
        kubectl apply -f k8s/service.yaml
        kubectl apply -f k8s/ingress.yaml
        kubectl apply -f k8s/certificate.yaml

        # Wait for deployment to complete
        kubectl rollout status deployment/wisecow-deployment -n wisecow --timeout=300s

        # Verify deployment
        kubectl get pods -n wisecow
        kubectl get services -n wisecow
        kubectl get ingress -n wisecow

        echo "🎉 Production deployment completed!"

  # Notification Job
  notify:
    runs-on: ubuntu-latest
    needs: [deploy-prod]
    if: always()

    steps:
    - name: Notify on success
      if: needs.deploy-prod.result == 'success'
      run: |
        echo "✅ Wisecow deployment to production was successful!"

    - name: Notify on failure
      if: needs.deploy-prod.result == 'failure'
      run: |
        echo "❌ Wisecow deployment to production failed!"
        exit 1
